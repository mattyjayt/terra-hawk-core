name: docs
on:
  push:
    paths: ["**.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**.md"]
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links in Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments=false './**/*.md'
          fail: true
